meta:
  name: brand.yml

color:

  palette:
    Hellgrau: "#EDEBE7"
    Dunkelblau: "#002B54"
    Blau: "#308CCC"
    Hellblau: "#BCD9F3"
    Gruen: "#7BBA40"
    Hellgruen: "#C1DEBA"
    Rot_Braun: "#8E4454"
    Lachs: "#F0CCC4"
    Schwarz: "#000000"

  primary: Dunkelblau
  success: Gruen
  warning: Lachs
  danger: Rot_Braun

typography:

  fonts:
    - family: Inter
      source: google
    - family: IBM Plex Mono
      source: google
    - family: Rubik
      source: google

  base:
    family: Inter
    line-height: 1.6
  headings:
    family: Rubik
    weight: normal
  link:
    color: purple
  monospace:
    family: IBM Plex Mono
    size: 1em

defaults:
  bootstrap:
    version: 5
  quarto:
    format:
      # basic format-specific settings
      html:
      revealjs:
  shiny:
    # shiny specific settings
